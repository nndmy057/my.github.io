
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giới thiệu bản thân</title>

    <style>
        body {
            background-color: #ffe6f0;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: purple;
            font-size: 35px;
        }

        p {
            color: #333;
            font-size: 20px;
        }

        .gioithieu {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid pink;
            border-radius: 15px;
        }

        button {
            background-color: purple;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="gioithieu">
        <h1>GIỚI THIỆU BẢN THÂN</h1>

        <p>Họ và tên: Nguyễn Ngọc My</p>

        <p>Ngành học: Công nghệ thông tin</p>

        <p>Sở thích: Nghe nhạc, xem phim</p>

        <button>Xin chào!</button>
    </div>

</body>
</html>
