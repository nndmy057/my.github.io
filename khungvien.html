
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Các kiểu định dạng khung viền</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        .khung {
            background-color: white;
            width: 400px;
            padding: 15px;
            margin: 20px auto;
        }

        .vien1 {
            border: 3px solid red;
        }

        .vien2 {
            border: 3px dashed blue;
        }

        .vien3 {
            border: 3px dotted green;
        }

        .vien4 {
            border: 5px double purple;
        }

        .vien5 {
            border: 5px groove orange;
        }

        .vien6 {
            border: 5px ridge pink;
        }

        .vien7 {
            border: 5px inset brown;
        }

        .vien8 {
            border: 5px outset gray;
        }

        .vien9 {
            border: none;
        }
    </style>
</head>

<body>

    <h1>CÁC KIỂU ĐỊNH DẠNG KHUNG VIỀN</h1>

    <div class="khung vien1">Solid - Nét liền</div>

    <div class="khung vien2">Dashed - Nét đứt</div>

    <div class="khung vien3">Dotted - Nét chấm</div>

    <div class="khung vien4">Double - Hai đường viền</div>

    <div class="khung vien5">Groove - Viền rãnh</div>

    <div class="khung vien6">Ridge - Viền nổi</div>

    <div class="khung vien7">Inset - Viền chìm</div>

    <div class="khung vien8">Outset - Viền nhô</div>

    <div class="khung vien9">None - Không có viền</div>

</body>
</html>
