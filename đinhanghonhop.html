
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Định dạng hỗn hợp</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fce4ec;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: red;
            text-align: center;
            font-size: 30px;
            text-transform: uppercase;
        }

        .noidung {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border: 3px solid pink;
            border-radius: 15px;
        }

        h2 {
            color: blue;
            text-align: center;
        }

        p {
            color: #333333;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
        }

        .dacbiet {
            color: purple;
            font-weight: bold;
            text-align: center;
            background-color: #f3e5f5;
            padding: 15px;
            border: 2px dashed purple;
        }

        img {
            width: 200px;
            display: block;
            margin: 20px auto;
            border: 4px solid pink;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1>ĐỊNH DẠNG HỖN HỢP</h1>

    <div class="noidung">

        <h2>Giới thiệu bản thân</h2>

        <p>
            Xin chào! Mình là sinh viên ngành Công nghệ thông tin.
            Mình yêu thích lập trình và thiết kế website.
            Mục tiêu của mình là học thật tốt HTML và CSS.
        </p>

        <p class="dacbiet">
            Chào mừng bạn đến với trang web của mình!
        </p>

        <img src="https://picsum.photos/300/200"
             alt="Hình ảnh minh họa">

    </div>

</body>
</html>
